[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-spec"
version = "0.1.0"
description = "Replay experiments for speculative tool calls under shared API quotas"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]
analysis = ["matplotlib>=3.9,<4"]
dev = ["ruff>=0.11,<1"]
paper = ["gymnasium==0.29.1", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "pandas>=2.2,<3", "httpx>=0.28,<1"]

[project.scripts]
quota-hotpot = "quota_spec.hotpot_runtime:main"
quota-upstream = "quota_spec.upstream:main"
quota-hotpot-export = "quota_spec.stage_export:main"
quota-paper-reference = "quota_spec.paper:main"
quota-capture-audit = "quota_spec.capture_audit:main"
quota-capture-bank = "quota_spec.capture_bank:main"
quota-frozen-study = "quota_spec.frozen_replay:main"
quota-forecast-inputs = "quota_spec.frozen_forecasts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
