name: Offline verification
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
  baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[paper]'
      - run: python -m quota_spec.upstream
      - run: python -m unittest discover -s tests/baseline -v
      - run: make offline PYTHON=python OUTPUT=results/hotpot-ci
  extensions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
        extras: ['', '[live,analysis]']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.${{ matrix.extras }}'
      - run: python -m unittest discover -s tests/extensions -v
